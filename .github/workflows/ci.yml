name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.10.0"
      - run: make fmt-check

  validate:
    name: terraform validate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.10.0"
      # Temporary dependency for #1828; remove after provider 8.1.0 is released.
      - name: Install access-policy provider snapshot
        if: github.event_name == 'pull_request' && (github.head_ref == 'fix/1746-appgw-cache-plan' || github.head_ref == 'feat/1828-appgw-access-policies')
        uses: ./.github/actions/setup-ccp-test-provider
      - run: make validate

  lint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.10.0"
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: latest
      - run: make lint

  test:
    name: terraform test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.10.0"
      # Temporary dependency for #1828; remove after provider 8.1.0 is released.
      - name: Install access-policy provider snapshot
        if: github.event_name == 'pull_request' && (github.head_ref == 'fix/1746-appgw-cache-plan' || github.head_ref == 'feat/1828-appgw-access-policies')
        uses: ./.github/actions/setup-ccp-test-provider
      - run: make test
